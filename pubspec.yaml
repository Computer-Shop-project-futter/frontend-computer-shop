name: computer_shop
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^8.1.0
  flutter_riverpod: ^2.4.0
  carousel_slider: ^5.1.2
  shared_preferences: ^2.5.5
  # State Management 
  provider: ^6.1.2 
  # Responsive UI 
  flutter_screenutil: ^5.9.3 
  # HTTP Request 
  dio: ^5.5.0+1 
  # Date & Currency Formatter 
  intl: ^0.19.0 
  # SVG Support 
  flutter_svg: ^2.0.10+1 
  # Loading Animation 
  shimmer: ^3.0.0 
  # Icons 
  font_awesome_flutter: ^10.7.0
  # Image Picker
  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
  fonts:
    - family: Schyler
      fonts:
        - asset: fonts/Schyler-Regular.ttf
        - asset: fonts/Schyler-Italic.ttf
          style: italic
