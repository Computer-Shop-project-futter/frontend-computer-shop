name: computer_shop
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  
  # Navigation
  go_router: ^13.0.0

  # Supabase
  supabase_flutter: ^2.14.1
  supabase: ^2.5.0

  # Connectivity
  connectivity_plus: ^5.0.0
  
  # Database
  sqflite: ^2.3.0
  path: ^1.9.0
  
  # Video Player
  video_player: ^2.8.0
  
  # Carousel
  carousel_slider: ^5.1.2
  shared_preferences: ^2.5.5
  # State Management 
  provider: ^6.1.2 
  flutter_riverpod: ^2.5.1
  # Responsive UI 
  flutter_screenutil: ^5.9.3 
  # HTTP Request 
  dio: ^5.5.0+1 
  # Date & Currency Formatter 
  intl: ^0.19.0 
  # SVG Support 
  flutter_svg: ^2.0.10+1 
  # Loading Animation 
  shimmer: ^3.0.0 
  # Icons 
  font_awesome_flutter: ^10.7.0
  # Image Picker
  image_picker: ^1.1.2
  
  # Environment variables
  flutter_dotenv: ^5.1.0

  # Secure token storage (used directly in api_client.dart)
  flutter_secure_storage: ^9.2.2
  # Supabase auth types (used directly in auth_repository_supabase.dart)
  gotrue: ^2.8.1
  # JSON codegen annotations (used directly in several domain models)
  json_annotation: ^4.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter


  build_runner: ^2.4.6
  json_serializable: ^6.6.1

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/.env
    - assets/images/
    - assets/videos/

